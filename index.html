<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Buscador Digimon</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<h1>Buscador de Digimon</h1>
<p>Ariel David Limachi Marca - C.I.: 9924624</p>

<input type="text" id="valor" placeholder="Nombre o nivel">
<button onclick="buscar()">Buscar</button>

<table>
  <thead>
    <tr>
      <th>Nombre</th>
      <th>Nivel</th>
    </tr>
  </thead>
  <tbody id="tabla"></tbody>
</table>

<script>
function buscar() {
  const valor = document.getElementById('valor').value.trim().toLowerCase();
  const tbody = document.getElementById('tabla');
  tbody.innerHTML = '';

  if (!valor) return alert("Ingrese nombre o nivel");

  let url = '';
  if (['fresh','in training','rookie','champion','ultimate','mega'].includes(valor)) {
    url = `https://digimon-api.vercel.app/api/digimon/level/${valor}`;
  } else {
    url = `https://digimon-api.vercel.app/api/digimon/name/${valor}`;
  }

  fetch(url)
    .then(res => res.json())
    .then(data => {
      console.log("Resultados Digimon:", data);
      data.forEach(d => {
        tbody.innerHTML += `<tr><td>${d.name}</td><td>${d.level}</td></tr>`;
      });
    })
    .catch(err => alert("Digimon no encontrado"));
}
</script>
</body>
</html>
